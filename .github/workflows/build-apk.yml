name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Préparer le dossier web
        run: |
          mkdir www
          cp index.html www/
          cp manifest.webmanifest www/ 2>/dev/null || true
          cp icon-192.png www/ 2>/dev/null || true
          cp sw.js www/ 2>/dev/null || true

      - name: Installer Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/text-to-speech@5 @capacitor/filesystem@6 @capacitor/share@6

      - name: Créer le projet Android
        run: |
          npx cap init "Générique défilant" com.generique.defilant --web-dir www
          npx cap add android
          npx cap sync android

      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: generique-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
